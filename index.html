      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              primary: {
                50: 'rgb(var(--color-primary-50) / <alpha-value>)',
                100: 'rgb(var(--color-primary-100) / <alpha-value>)',
                200: 'rgb(var(--color-primary-200) / <alpha-value>)',
                300: 'rgb(var(--color-primary-300) / <alpha-value>)',
                400: 'rgb(var(--color-primary-400) / <alpha-value>)',
                500: 'rgb(var(--color-primary-500) / <alpha-value>)',
                600: 'rgb(var(--color-primary-600) / <alpha-value>)',
                700: 'rgb(var(--color-primary-700) / <alpha-value>)',
                800: 'rgb(var(--color-primary-800) / <alpha-value>)',
                900: 'rgb(var(--color-primary-900) / <alpha-value>)',
              },
              dark: {
                bg: '#050505',
                surface: '#0a0a0a',
                border: '#1f1f1f'
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.45s ease-out forwards',
              'card-reveal': 'cardReveal 0.55s ease-out forwards',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
              'float-fast': 'float 6s ease-in-out infinite',
              'float-slow': 'float 12s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 15s linear infinite',
              'bounce-slow': 'bounce 3s infinite',
              'gradient-x': 'gradientX 7s ease-in-out infinite',
              'modal-pop': 'modalPop 0.3s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              cardReveal: {
                '0%': { opacity: '0', transform: 'translateY(14px) scale(0.95)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              gradientX: {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              modalPop: {
                '0%': { opacity: '0', transform: 'translateY(18px) scale(0.95)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
            }
          }
        }
      }

    <style>
      :root {
        /* Cyan/Electric Blue default */
        --color-primary-50: 236 254 255;
        --color-primary-100: 207 250 254;
        --color-primary-200: 165 243 252;
        --color-primary-300: 103 232 249;
        --color-primary-400: 34 211 238;
        --color-primary-500: 6 182 212;
        --color-primary-600: 8 145 178;
        --color-primary-700: 14 116 144;
        --color-primary-800: 21 94 117;
        --color-primary-900: 22 78 99;
      }

      body {
        font-family: 'Outfit', sans-serif;
      }
      html, body, #root {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      img, video {
        max-width: 100%;
        height: auto;
      }

      h1, h2, h3, h4, h5, h6, .font-display {
        font-family: 'Space Grotesk', sans-serif;
      }
      
      /* Advanced Glassmorphism */
      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 
          0 4px 6px -1px rgba(0, 0, 0, 0.02), 
          0 2px 4px -1px rgba(0, 0, 0, 0.02),
          inset 0 0 20px rgba(255, 255, 255, 0.6);
      }
      
      .dark .glass-card {
        background: rgba(10, 10, 10, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      .glass-nav {
         background: rgba(255, 255, 255, 0.8);
         backdrop-filter: blur(10px);
         -webkit-backdrop-filter: blur(10px);
         border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }

      .dark .glass-nav {
         background: rgba(5, 5, 5, 0.8);
         border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* Global form contrast fixes for dropdowns/inputs */
      select {
        background: #ffffff;
        color: #111827;
        border-color: #d1d5db;
      }
      .dark select {
        background: #1f2937;
        color: #ffffff;
        border-color: #4b5563;
      }
      select option {
        background: #ffffff;
        color: #111827;
      }
      .dark select option {
        background: #1f2937;
        color: #ffffff;
      }

      img[data-brand-logo="true"] {
        max-width: 180px;
      }

      /* Tech Background Pattern - Light Mode Optimized */
      .bg-grid-pattern {
        background-size: 60px 60px;
        background-image: 
          linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
        mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      }

      .dark .bg-grid-pattern {
        background-image: 
          linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      }

      .tech-border {
        position: relative;
      }
      .tech-border::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 10px; height: 1px;
        background: currentColor;
      }
      .tech-border::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 1px; height: 10px;
        background: currentColor;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #333;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--color-primary-500));
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      @keyframes homeCardReveal {
        0% { opacity: 0; transform: translateY(14px) scale(0.97); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes homeCardDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(8px); }
      }

      .home-product-slide {
        animation:
          homeCardReveal 0.55s ease-out var(--reveal-delay, 0ms) forwards,
          homeCardDrift 4.5s ease-in-out calc(var(--reveal-delay, 0ms) + 650ms) infinite;
      }

      .animate-fade-in-up,
      .animate-fade-in,
      .animate-float,
      .animate-float-fast,
      .animate-float-slow,
      .home-product-slide {
        will-change: transform, opacity;
      }
