    <circle cx="580" cy="660" r="4.1"/>
    <circle cx="760" cy="620" r="3.6"/>
    <circle cx="930" cy="570" r="5.2"/>
    <circle cx="1035" cy="610" r="3.9"/>
    <circle cx="1160" cy="660" r="4.4"/>
    <circle cx="1320" cy="620" r="3.7"/>
    <circle cx="1490" cy="590" r="4.3"/>
    <circle cx="1660" cy="640" r="3.8"/>
