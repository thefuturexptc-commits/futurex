<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">TFX Smart Band EMI checkout</title>
  <desc id="desc">A checkout illustration showing EMI plans of three, six and nine months.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a2433"/><stop offset="1" stop-color="#526078"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <rect width="1200" height="675" fill="#070d1d" opacity=".45"/>
  <g opacity=".32" transform="translate(90 120) rotate(-15)"><rect x="0" y="0" width="270" height="460" rx="80" fill="#0b111d"/><rect x="70" y="-95" width="130" height="650" rx="65" fill="#111b29"/><path d="M92 10h86v440H92z" fill="#263449"/></g>
  <g filter="url(#shadow)">
    <rect x="405" y="75" width="390" height="525" rx="18" fill="#fff"/>
    <text x="600" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3d4758">Pay with Razorpay EMI</text>
    <text x="600" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#101522">Pay only ₹1,111 now</text>
    <text x="600" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6472">Indicative split. Final EMI plans, bank eligibility, interest, and</text>
    <text x="600" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6472">charges are shown at checkout.</text>
    <rect x="425" y="215" width="350" height="166" rx="16" fill="#fafbfd"/>
    <g font-family="Arial, sans-serif" text-anchor="middle"><g transform="translate(492 270)"><circle r="30" fill="none" stroke="#dce8f5" stroke-width="10"/><path d="M0-30a30 30 0 1 1-28 40" fill="none" stroke="#11b9ae" stroke-width="10"/><text y="54" font-size="14" fill="#171b26">₹3,333</text><text y="75" font-size="11" fill="#626c7a">3 Months</text></g><g transform="translate(600 270)"><circle r="30" fill="none" stroke="#dce8f5" stroke-width="10"/><path d="M0-30a30 30 0 1 1-28 40" fill="none" stroke="#11b9ae" stroke-width="10"/><text y="54" font-size="14" fill="#171b26">₹1,667</text><text y="75" font-size="11" fill="#626c7a">6 Months</text></g><g transform="translate(708 270)"><circle r="30" fill="none" stroke="#dce8f5" stroke-width="10"/><path d="M0-30a30 30 0 1 1-28 40" fill="none" stroke="#11b9ae" stroke-width="10"/><text y="54" font-size="14" fill="#171b26">₹1,111</text><text y="75" font-size="11" fill="#626c7a">9 Months</text></g></g>
    <text x="452" y="352" font-family="Arial, sans-serif" font-size="11" fill="#303846">Total order value</text><text x="748" y="352" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#171b26">₹9,999</text>
    <rect x="405" y="435" width="390" height="165" rx="0 0 18 18" fill="#f1f5fb"/>
    <text x="600" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#171b26">Get started with Razorpay EMI</text>
    <rect x="425" y="492" width="165" height="42" rx="4" fill="#fff"/><rect x="600" y="492" width="175" height="42" rx="4" fill="#fff"/><text x="439" y="518" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#9ba3b0">First Name</text><text x="614" y="518" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#9ba3b0">Last Name</text>
    <rect x="425" y="546" width="200" height="42" rx="4" fill="#fff"/><text x="439" y="572" font-family="Arial, sans-serif" font-size="13" fill="#7a8492">+91 &nbsp; Enter Mobile No.</text><rect x="635" y="546" width="140" height="42" rx="4" fill="#080d24"/><text x="705" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#fff">Buy on EMI</text>
  </g>
</svg>
