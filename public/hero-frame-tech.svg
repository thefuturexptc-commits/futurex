<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="960" y1="0" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#010717"/>
      <stop offset="0.48" stop-color="#03123A"/>
      <stop offset="1" stop-color="#00040F"/>
    </linearGradient>
    <radialGradient id="midGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 545) rotate(90) scale(240 980)">
      <stop stop-color="#43D5FF" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#2B8FFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2B8FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="260" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AB7FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#2F8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1E6DFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurHeavy" x="-200" y="-120" width="2320" height="1320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurSoft" x="-200" y="-120" width="2320" height="1320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#midGlow)"/>

  <g filter="url(#blurHeavy)" opacity="0.8">
    <rect x="180" y="140" width="40" height="820" fill="url(#beam)"/>
    <rect x="420" y="80" width="34" height="900" fill="url(#beam)"/>
    <rect x="660" y="120" width="44" height="860" fill="url(#beam)"/>
    <rect x="910" y="20" width="48" height="1020" fill="url(#beam)"/>
