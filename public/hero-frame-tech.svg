    <rect x="1360" y="140" width="34" height="860" fill="url(#beam)"/>
    <rect x="1600" y="60" width="44" height="940" fill="url(#beam)"/>
  </g>

  <g filter="url(#blurSoft)" opacity="0.75" stroke="#4DB8FF">
    <path d="M120 620H1800" stroke-width="2"/>
    <path d="M200 560H1720" stroke-width="1.6"/>
    <path d="M260 680H1660" stroke-width="1.2"/>
